# Formats and mounts each perf node's instance-store NVMe at /mnt/k8s-disks/0.
# Apply before the systems under test (install-all.sh does).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mount-nvme
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: mount-nvme
  template:
    metadata:
      labels:
        app: mount-nvme
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values:
                      - m7gd.2xlarge
                      - m7gd.4xlarge
      tolerations:
        - key: perf
          operator: Equal
          value: "true"
          effect: NoSchedule
      hostPID: true
      containers:
        - name: mount
          image: public.ecr.aws/docker/library/busybox:1.36.1
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -eu
              TARGET=/mnt/k8s-disks/0
              h() { nsenter -t 1 -m -u -i -n -- "$@"; }

              DEV=$(h lsblk -dn -o NAME,MODEL \
                    | grep -i 'Instance Storage' | awk '{print $1}' | head -1)
              if [ -z "$DEV" ]; then
                echo "FATAL: no instance-store device on this node"
                echo "The instance type may not have one, or it is already in use."
                exit 1
              fi
              DEV=/dev/$DEV
              echo "instance-store device: $DEV"

              if h mountpoint -q "$TARGET"; then
                echo "$TARGET already mounted, nothing to do"
              else
                FS=$(h blkid -o value -s TYPE "$DEV" 2>/dev/null || true)
                if [ -z "$FS" ]; then
                  echo "no filesystem on $DEV -- creating xfs"
                  h mkfs.xfs -f "$DEV"
                else
                  echo "existing $FS filesystem on $DEV -- keeping it"
                fi
                h mkdir -p "$TARGET"
                h mount "$DEV" "$TARGET"
                echo "mounted $DEV at $TARGET"
              fi

              h df -h "$TARGET"

              sleep infinity
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
