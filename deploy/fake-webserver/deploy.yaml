# The load generator: 24 replicas of openobserve/fake-webserver:v2, no flags.
#
# Cardinality scales linearly with `replicas` (~45,220 bucket series per pod);
# 24 is what puts the unfiltered histogram over a million series. The histogram
# has 25 buckets + `+Inf`, so `_bucket` is exactly 26x `_count`.
# See deploy/README.md. Re-run bench/cardinality.sh after changing replicas.
#
# Tolerates the `perf` taint, so replicas MAY land on the four nodes under
# test -- this is how the published run was configured. A toleration permits
# those nodes, it does not prefer them: spread over the cluster's arm64 nodes,
# only a handful land there. Check with `kubectl -n perf-fakeserver get pods -o wide`,
# or delete the toleration block below to keep the load off them entirely.
apiVersion: v1
kind: Namespace
metadata:
  name: perf-fakeserver
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-webserver
  namespace: perf-fakeserver
  labels:
    app: fake-webserver
spec:
  replicas: 24
  selector:
    matchLabels:
      app: fake-webserver
  template:
    metadata:
      labels:
        app: fake-webserver
    spec:
      # Drop this if your cluster is amd64 -- the image is multi-arch.
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
      - key: perf
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
        - name: fake-webserver
          image: openobserve/fake-webserver:v2
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 64m
              memory: "64Mi"
            limits:
              cpu: "64m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: fake-webserver
  namespace: perf-fakeserver
  labels:
    app: fake-webserver
spec:
  selector:
    app: fake-webserver
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
