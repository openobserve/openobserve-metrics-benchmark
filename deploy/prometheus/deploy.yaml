# Prometheus, receive (remote write) and query only.
apiVersion: v1
kind: Namespace
metadata:
  name: perf-prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/name: prometheus-standalone
  name: prometheus-standalone-config
  namespace: perf-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s

    # The backfill's concurrent senders reorder neighbouring steps; without a window that is a 400.
    storage:
      tsdb:
        out_of_order_time_window: 2h

    scrape_configs: []
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/name: prometheus-standalone
  name: prometheus-standalone
  namespace: perf-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: prometheus
      app.kubernetes.io/name: prometheus-standalone
  serviceName: prometheus-standalone
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: prometheus
        app.kubernetes.io/name: prometheus-standalone
    spec:
      nodeSelector:
        perf-system: prometheus
      tolerations:
      - key: perf
        operator: Equal
        value: "true"
        effect: NoSchedule
      initContainers:
      - name: chown-data
        image: public.ecr.aws/docker/library/busybox:1.36.1
        command: ['sh', '-c', 'chown -R 1000:2000 /prometheus']
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /prometheus
          name: data
      containers:
      - name: prometheus-standalone
        image: quay.io/prometheus/prometheus:v3.6.0
        imagePullPolicy: IfNotPresent
        args:
          - --config.file=/etc/prometheus/prometheus.yml
          - --storage.tsdb.path=/prometheus
          - --web.enable-lifecycle
          - --web.enable-remote-write-receiver
          - --query.max-samples=1000000000
          - --query.timeout=600s
        ports:
        - containerPort: 9090
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 12
            memory: 24G
          requests:
            cpu: 12
            memory: 24G
        securityContext: {}
        volumeMounts:
        - mountPath: /prometheus
          name: data
        - name: prometheus-config
          mountPath: /etc/prometheus
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-standalone-config
      - name: data
        hostPath:
          path: /mnt/k8s-disks/0/run-a/prometheus
          type: DirectoryOrCreate
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      securityContext:
        fsGroup: 2000
        runAsGroup: 3000
        runAsNonRoot: true
        runAsUser: 1000
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
---
apiVersion: v1
kind: Service
metadata:
  name: perf-prometheus-standalone
  namespace: perf-prometheus
  labels:
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/name: prometheus-standalone
spec:
  selector:
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/name: prometheus-standalone
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  type: ClusterIP
