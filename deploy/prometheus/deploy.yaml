# Standalone Prometheus, in "receive and query only" mode.
#
# It scrapes nothing itself (scrape_configs is empty). All load arrives via
# remote write from the OTel Collector gateway, so Prometheus, Mimir and both
# OpenObserve deployments receive byte-identical input.
apiVersion: v1
kind: Namespace
metadata:
  name: perf-prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/name: prometheus-standalone
  name: prometheus-standalone-config
  namespace: perf-prometheus
data:
  prometheus.yml: |
    # Perf-test mode: ingest via remote write + serve queries only.
    # fake-webserver metrics are scraped by the OTel Collector gateway
    # (receiver prometheus/perf-fakeserver) and forwarded here.
    global:
      scrape_interval: 15s
      scrape_timeout: 10s

    scrape_configs: []
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/name: prometheus-standalone
  name: prometheus-standalone
  namespace: perf-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: prometheus
      app.kubernetes.io/name: prometheus-standalone
  serviceName: prometheus-standalone
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: prometheus
        app.kubernetes.io/name: prometheus-standalone
    spec:
      # Pin to the node holding this system's data. The dataset lives on that
      # node's instance store, and hostPath is node-local: without this, a
      # restart can land the pod on a different perf node, where the hostPath
      # is created empty and the system comes up with no data. It looks like
      # data loss and is not -- the dataset is still on the original node.
      # Label the nodes once, matching one system each:
      #   kubectl label node <node> perf-system=prometheus
      nodeSelector:
        perf-system: prometheus
      tolerations:
      - key: perf
        operator: Equal
        value: "true"
        effect: NoSchedule
      initContainers:
      # hostPath directories are created root-owned; fsGroup does not apply to
      # them, so hand the volume to the uid the container actually runs as.
      - name: chown-data
        image: public.ecr.aws/docker/library/busybox:1.36.1
        command: ['sh', '-c', 'chown -R 1000:2000 /prometheus']
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /prometheus
          name: data
      containers:
      - name: prometheus-standalone
        image: quay.io/prometheus/prometheus:v3.6.0
        imagePullPolicy: IfNotPresent
        args:
          # --web.enable-remote-write-receiver is what makes /api/v1/write work.
          - --config.file=/etc/prometheus/prometheus.yml
          - --storage.tsdb.path=/prometheus
          - --web.enable-lifecycle
          - --web.enable-remote-write-receiver
          - --query.max-samples=1000000000
          - --query.timeout=600s
        ports:
        - containerPort: 9090
          name: http
          protocol: TCP
        # 7C/28G, identical on all four systems. See deploy/README.md#sizing.
        resources:
          limits:
            cpu: 7000m
            memory: 28G
          requests:
            cpu: 7000m
            memory: 28G
        securityContext: {}
        volumeMounts:
        - mountPath: /prometheus
          name: data
        - name: prometheus-config
          mountPath: /etc/prometheus
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-standalone-config
      # Instance-store NVMe. See deploy/local-nvme/README.md -- the node must
      # mount it at /mnt/k8s-disks/0, and the data is EPHEMERAL: a node
      # replacement loses the whole dataset.
      - name: data
        hostPath:
          # Dataset switch: change this one path component to keep an old
          # dataset on disk and start a new one. See deploy/README.md#datasets.
          path: /mnt/k8s-disks/0/run-rehearsal/prometheus
          type: DirectoryOrCreate
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      securityContext:
        fsGroup: 2000
        runAsGroup: 3000
        runAsNonRoot: true
        runAsUser: 1000
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
---
apiVersion: v1
kind: Service
metadata:
  name: perf-prometheus-standalone
  namespace: perf-prometheus
  labels:
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/name: prometheus-standalone
spec:
  selector:
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/name: prometheus-standalone
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  type: ClusterIP
