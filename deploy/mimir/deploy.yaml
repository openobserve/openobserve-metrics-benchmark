# Grafana Mimir, single-binary ("monolithic") mode on a local PVC.
#
# Based on Mimir's own demo config, with ingestion and query limits raised.
# Mimir needs BOTH querier.timeout and server.http_server_write_timeout to
# honour a 600s query. See deploy/README.md#query-limits.
apiVersion: v1
kind: Namespace
metadata:
  name: perf-mimir
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/name: mimir-standalone
  name: mimir-standalone-config
  namespace: perf-mimir
data:
  demo.yaml: |
    # Do not use this configuration in production.
    # It is for benchmark purposes only.
    multitenancy_enabled: false

    activity_tracker:
      filepath: /mimir/activity.log

    blocks_storage:
      backend: filesystem
      bucket_store:
        sync_dir: /mimir/tsdb-sync
      filesystem:
        dir: /mimir/data/tsdb
      tsdb:
        dir: /mimir/tsdb

    compactor:
      data_dir: /mimir/compactor
      sharding_ring:
        kvstore:
          store: memberlist

    distributor:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
      ha_tracker:
        enable_ha_tracker: true
        kvstore:
          store: memberlist

    ingester:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
        replication_factor: 1

    ruler:
      rule_path: /mimir/data-ruler/

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /mimir/rules

    querier:
      timeout: 600s

    server:
      http_listen_port: 9009
      log_level: error
      http_server_write_timeout: 600s

    store_gateway:
      sharding_ring:
        replication_factor: 1

    # Write-path limits raised well above what the load generator produces, so
    # nothing is dropped or throttled during ingestion.
    limits:
      ingestion_rate: 20000000
      ingestion_burst_size: 20000000
      max_global_series_per_user: 150000000
      max_fetched_chunks_per_query: 20000000
      ha_cluster_label: prometheus
      ha_replica_label: prometheus_replica
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/name: mimir-standalone
  name: mimir-standalone
  namespace: perf-mimir
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: mimir
      app.kubernetes.io/name: mimir-standalone
  serviceName: mimir-standalone
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mimir
        app.kubernetes.io/name: mimir-standalone
    spec:
      # Pin to the node holding this system's data -- see the same block in
      # prometheus/deploy.yaml for why.
      nodeSelector:
        perf-system: mimir
      tolerations:
      - key: perf
        operator: Equal
        value: "true"
        effect: NoSchedule
      initContainers:
      # hostPath directories are created root-owned; fsGroup does not apply to
      # them, so hand the volume to the uid the container actually runs as.
      - name: chown-data
        image: public.ecr.aws/docker/library/busybox:1.36.1
        command: ['sh', '-c', 'chown -R 10000:2000 /mimir']
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /mimir
          name: data
      containers:
      - name: mimir-standalone
        # The published run used grafana/mimir:latest, pulled 2026-08. Pin a
        # concrete tag if you need the comparison to stay stable over time.
        image: grafana/mimir:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9009
          name: http
          protocol: TCP
        # 7C/28G, identical on all four systems. See deploy/README.md#sizing.
        resources:
          limits:
            cpu: 7000m
            memory: 28G
          requests:
            cpu: 7000m
            memory: 28G
        securityContext: {}
        command: ['mimir', '--config.file', '/etc/mimir/demo.yaml']
        volumeMounts:
        - mountPath: /mimir
          name: data
        - name: mimir-config
          mountPath: /etc/mimir
      volumes:
      - name: mimir-config
        configMap:
          name: mimir-standalone-config
      # Instance-store NVMe. See deploy/local-nvme/README.md -- the node must
      # mount it at /mnt/k8s-disks/0, and the data is EPHEMERAL: a node
      # replacement loses the whole dataset.
      - name: data
        hostPath:
          # Dataset switch -- see deploy/README.md#datasets.
          path: /mnt/k8s-disks/0/run-a/mimir
          type: DirectoryOrCreate
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      securityContext:
        fsGroup: 2000
        runAsGroup: 3000
        runAsNonRoot: true
        runAsUser: 10000
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
---
apiVersion: v1
kind: Service
metadata:
  name: perf-mimir-standalone
  namespace: perf-mimir
  labels:
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/name: mimir-standalone
spec:
  selector:
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/name: mimir-standalone
  ports:
    - name: http
      port: 9009
      targetPort: 9009
  type: ClusterIP
