# Mimir single binary, filesystem blocks storage.
apiVersion: v1
kind: Namespace
metadata:
  name: perf-mimir
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/name: mimir-standalone
  name: mimir-standalone-config
  namespace: perf-mimir
data:
  demo.yaml: |
    multitenancy_enabled: false

    activity_tracker:
      filepath: /mimir/activity.log

    blocks_storage:
      backend: filesystem
      bucket_store:
        sync_dir: /mimir/tsdb-sync
        sync_interval: 1m
        ignore_deletion_mark_delay: 5m
        ignore_deletion_mark_while_querying_delay: 4m
      filesystem:
        dir: /mimir/data/tsdb
      tsdb:
        dir: /mimir/tsdb
        head_compaction_idle_timeout: 5m
        # Ingester copies go 15m after upload; queries read object storage, like the others read disk.
        retention_period: 15m

    compactor:
      data_dir: /mimir/compactor
      first_level_compaction_wait_period: 1m
      compaction_interval: 5m
      cleanup_interval: 5m
      deletion_delay: 10m
      sharding_ring:
        kvstore:
          store: memberlist

    distributor:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
      ha_tracker:
        enable_ha_tracker: true
        kvstore:
          store: memberlist

    ingester:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
        replication_factor: 1

    ruler:
      rule_path: /mimir/data-ruler/

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /mimir/rules

    querier:
      timeout: 600s

    server:
      http_listen_port: 9009
      log_level: error
      http_server_write_timeout: 600s

    store_gateway:
      sharding_ring:
        replication_factor: 1

    limits:
      ingestion_rate: 20000000
      ingestion_burst_size: 20000000
      max_global_series_per_user: 150000000
      max_fetched_chunks_per_query: 20000000
      ha_cluster_label: prometheus
      ha_replica_label: prometheus_replica
      # Same reason as Prometheus: the backfill reorders neighbouring steps.
      out_of_order_time_window: 2h
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/name: mimir-standalone
  name: mimir-standalone
  namespace: perf-mimir
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: mimir
      app.kubernetes.io/name: mimir-standalone
  serviceName: mimir-standalone
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mimir
        app.kubernetes.io/name: mimir-standalone
    spec:
      nodeSelector:
        perf-system: mimir
      tolerations:
      - key: perf
        operator: Equal
        value: "true"
        effect: NoSchedule
      initContainers:
      - name: chown-data
        image: public.ecr.aws/docker/library/busybox:1.36.1
        command: ['sh', '-c', 'chown -R 10000:2000 /mimir']
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /mimir
          name: data
      containers:
      - name: mimir-standalone
        image: grafana/mimir:3.2.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9009
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 12
            memory: 24G
          requests:
            cpu: 12
            memory: 24G
        securityContext: {}
        command: ['mimir', '--config.file', '/etc/mimir/demo.yaml']
        volumeMounts:
        - mountPath: /mimir
          name: data
        - name: mimir-config
          mountPath: /etc/mimir
      volumes:
      - name: mimir-config
        configMap:
          name: mimir-standalone-config
      - name: data
        hostPath:
          path: /mnt/k8s-disks/0/run-a/mimir
          type: DirectoryOrCreate
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      securityContext:
        fsGroup: 2000
        runAsGroup: 3000
        runAsNonRoot: true
        runAsUser: 10000
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
---
apiVersion: v1
kind: Service
metadata:
  name: perf-mimir-standalone
  namespace: perf-mimir
  labels:
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/name: mimir-standalone
spec:
  selector:
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/name: mimir-standalone
  ports:
    - name: http
      port: 9009
      targetPort: 9009
  type: ClusterIP
