# OpenObserve single-node, storing files in PARQUET.
#
# Differs from ../openobserve-vortex/values.yaml in ZO_FILE_FORMAT only.
# Diff the two before every run; anything else means the A/B is contaminated.

image:
  oss:
    repository: openobserve/openobserve
    tag: "v0.92.0"
  enterprise:
    repository: openobserve/openobserve-enterprise
    tag: "unset"
  busybox:
    repository: public.ecr.aws/docker/library/busybox
    tag: 1.36.1
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
clusterDomain: "cluster.local"

serviceAccount:
  create: true
  # No IRSA / cloud role: storage is the local PVC, nothing talks to S3.
  annotations: {}
  name: ""

podAnnotations: {}

labels: {}

podSecurityContext:
  fsGroup: 0
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false

securityContext: {}

cache:
  enabled: false

# Off: the chart only offers a PVC or an emptyDir, and we want the node's
# instance-store NVMe. ZO_DATA_DIR below points at a hostPath instead, so the
# chart's /data emptyDir is left unused. See deploy/local-nvme/README.md.
persistence:
  enabled: false

# Instance-store NVMe. The data is EPHEMERAL: a node replacement loses the
# whole dataset. The pod runs as root (podSecurityContext above), so the
# root-owned hostPath directory needs no chown init container.
extraVolumeMounts:
  - name: nvme
    mountPath: /nvme
extraVolumes:
  - name: nvme
    hostPath:
      # Dataset switch -- see deploy/README.md#datasets.
      path: /mnt/k8s-disks/0/run-a/o2-parquet
      type: DirectoryOrCreate

headless:
  enabled: true
  service:
    annotations: {}

# Demo credentials. Also encoded in the collector's exporters and in
# bench/config.sh -- change all three together.
auth:
  ZO_ROOT_USER_EMAIL: "root@example.com"
  ZO_ROOT_USER_PASSWORD: "Complexpass#123"
  ZO_ROOT_USER_TOKEN: ""

  # Unused: storage is the local PVC, not S3.
  ZO_S3_ACCESS_KEY: ""
  ZO_S3_SECRET_KEY: ""

  AZURE_STORAGE_ACCOUNT_KEY: ""
  AZURE_STORAGE_ACCOUNT_NAME: ""

  # Standalone uses sqlite; no external postgres.
  ZO_META_POSTGRES_DSN: ""

  existingRootUserSecret:
    name: ""
    emailKey: "ZO_ROOT_USER_EMAIL"
    passwordKey: "ZO_ROOT_USER_PASSWORD"

# https://openobserve.ai/docs/environment-variables/
config:
  ZO_APP_NAME: "openobserve"
  ZO_CLUSTER_NAME: "o2"
  ZO_INSTANCE_NAME: ""
  ZO_NODE_ROLE: "all"
  # Both required: ZO_LOCAL_MODE_STORAGE only applies while ZO_LOCAL_MODE=true.
  ZO_LOCAL_MODE: "true"
  ZO_LOCAL_MODE_STORAGE: "disk"
  ZO_DATA_DIR: "/nvme/"
  ZO_UI_ENABLED: "true"
  # Only needed if you expose the UI; empty is fine behind port-forward.
  ZO_WEB_URL: ""
  ZO_BASE_URI: ""
  # Standalone: sqlite on the PVC replaces the postgres + nats control plane.
  ZO_META_STORE: "sqlite"
  ZO_METRICS_DEDUP_ENABLED: "true"
  # Must match Mimir's ha_cluster_label / ha_replica_label so both systems
  # deduplicate the incoming remote-write stream the same way.
  ZO_PROMETHEUS_HA_CLUSTER: "prometheus"
  ZO_PROMETHEUS_HA_REPLICA: "prometheus_replica"
  # Enables /api/{org}/prometheus/api/v1/{write,query,query_range}.
  ZO_PROMETHEUS_ENABLED: "true"
  RUST_LOG: "info,config::axum=warn,tantivy=warn"
  RUST_BACKTRACE: "0"

extraEnv:
  # Defaults would reject the ~1.08M-series unfiltered histogram outright.
  - name: ZO_METRICS_MAX_SERIES_RESPONSE
    value: "40000"
  - name: ZO_METRICS_MAX_POINTS_PER_SERIES
    value: "10000000"
  # ON by default; OFF here because it measured ~20% SLOWER. Affects parquet
  # only, but set identically in both files to keep the A/B clean.
  - name: ZO_FEATURE_PUSHDOWN_FILTER_ENABLED
    value: "false"
  # Fairness: no query result caching, matching "caches disabled" on the others.
  - name: ZO_RESULT_CACHE_ENABLED
    value: "false"
  # >>> THE A/B VARIABLE <<<  parquet here, vortex in ../openobserve-vortex.
  - name: ZO_FILE_FORMAT
    value: "parquet"

serviceMonitor:
  enabled: false

service:
  type: ClusterIP
  http_port: 5080
  grpc_port: 5081
  annotations: {}

certIssuer:
  enabled: false

secret:
  annotations: {}

blockedMetrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 128Mi

# Use bench/port-forward.sh instead; ingress choice does not affect measurements.
ingress:
  enabled: false

gateway:
  enabled: false

# 7C/28G, identical on all four systems. See deploy/README.md#sizing.
resources:
  limits:
    cpu: 7
    memory: 14G
  requests:
    cpu: 7
    memory: 14G

nodeSelector: {}

# Same taint as the others: one system per perf node.
tolerations:
  - key: perf
    operator: Equal
    value: "true"
    effect: NoSchedule

affinity: {}

minio:
  enabled: false

probes:
  enabled: true
  initialDelaySeconds: 10
  failureThreshold: 3
  path: /healthz

enterprise:
  enabled: false

aiGateway:
  enabled: false
