# OpenObserve standalone. Only non-default chart values.
image:
  oss:
    repository: public.ecr.aws/zinclabs/openobserve
    tag: "v1.1.1-debug"

podSecurityContext:
  fsGroup: 0
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false

persistence:
  enabled: false

extraVolumes:
  - name: nvme
    hostPath:
      path: /mnt/k8s-disks/0/run-a/o2-parquet
      type: DirectoryOrCreate
extraVolumeMounts:
  - name: nvme
    mountPath: /nvme

config:
  ZO_DATA_DIR: "/nvme/"
  ZO_PROMETHEUS_ENABLED: "true"
  ZO_PROMETHEUS_HA_CLUSTER: "prometheus"
  ZO_PROMETHEUS_HA_REPLICA: "prometheus_replica"
  RUST_LOG: "info,config::axum=warn,tantivy=warn"

extraEnv:
  - name: ZO_METRICS_MAX_SERIES_RESPONSE
    value: "40000"
  - name: ZO_METRICS_MAX_POINTS_PER_SERIES
    value: "10000000"
  - name: ZO_RESULT_CACHE_ENABLED
    value: "false"
  - name: ZO_METRICS_BLOCKS_CACHE_MAX_SIZE
    value: "2048"
  - name: ZO_COMPACT_DELETE_FILES_DELAY_MINUTES
    value: "10"
  # "false" during the backfill, "true" once file_list holds every sample.
  - name: ZO_COMPACT_ENABLED
    value: "true"
  - name: ZO_MAX_FILE_RETENTION_TIME
    value: "60"

resources:
  limits:
    cpu: 12
    memory: 24G
  requests:
    cpu: 12
    memory: 24G

nodeSelector:
  perf-system: o2-parquet
tolerations:
  - key: perf
    operator: Equal
    value: "true"
    effect: NoSchedule
